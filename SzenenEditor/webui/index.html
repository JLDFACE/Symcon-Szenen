<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<title>FACE · Szenen-Editor</title>
<script>
  // Theme vor dem Rendern setzen (kein FOUC)
  (function () {
    var s = localStorage.getItem('fse-theme');
    if (s) document.documentElement.setAttribute('data-theme', s);
  })();
</script>
<style>
/* ---- FACE Design-Tokens (Default = Light) ---- */
:root {
  --acc:#cc0000; --acc-hover:#a30000; --acc-ink:#ffffff;
  --bg:#f4f4f5; --card:#ffffff; --card2:#f4f4f5; --line:#e4e4e7;
  --fg:#111827; --txt:#374151; --mut:#6b7280;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
  --ring:rgba(204,0,0,.28);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg:#0f172a; --card:#1e293b; --card2:#273343; --line:#334155;
    --fg:#f1f5f9; --txt:#cbd5e1; --mut:#94a3b8;
    --acc:#ef4444; --acc-hover:#f87171; --acc-ink:#0b0b0c;
    --shadow:none; --ring:rgba(239,68,68,.35);
  }
}
:root[data-theme="dark"] {
  --bg:#0f172a; --card:#1e293b; --card2:#273343; --line:#334155;
  --fg:#f1f5f9; --txt:#cbd5e1; --mut:#94a3b8;
  --acc:#ef4444; --acc-hover:#f87171; --acc-ink:#0b0b0c;
  --shadow:none; --ring:rgba(239,68,68,.35);
}
:root[data-theme="light"] {
  --bg:#f4f4f5; --card:#ffffff; --card2:#f4f4f5; --line:#e4e4e7;
  --fg:#111827; --txt:#374151; --mut:#6b7280;
  --acc:#cc0000; --acc-hover:#a30000; --acc-ink:#ffffff;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
  --ring:rgba(204,0,0,.28);
}

* { box-sizing:border-box; margin:0; }
body { font-family:'Inter',system-ui,'Segoe UI',Roboto,sans-serif; font-size:14px;
  line-height:1.45; background:var(--bg); color:var(--txt);
  -webkit-font-smoothing:antialiased; }

/* ---- Header ---- */
header { display:flex; align-items:center; gap:14px; padding:12px 18px;
  background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:10; }
.brand { display:flex; align-items:center; gap:12px; min-width:0; }
.brand .logo { height:26px; width:auto; display:block; }
.brand .bsep { width:1px; height:24px; background:var(--line); flex:none; }
.brand .titles { display:flex; flex-direction:column; line-height:1.1; min-width:0; }
.brand .app { font-weight:700; font-size:15px; color:var(--fg); letter-spacing:-.01em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand .kick { font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--mut); }
:root[data-theme="dark"] .logo, :root[data-theme="dark"] .foot-logo { background:#fff; padding:3px 6px; border-radius:6px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) .logo, :root:not([data-theme]) .foot-logo { background:#fff; padding:3px 6px; border-radius:6px; }
}
.icobtn { background:var(--card2); color:var(--txt); border:1px solid var(--line);
  width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px; line-height:1;
  display:grid; place-items:center; margin-left:auto; flex:none; }
.icobtn:hover { border-color:var(--acc); color:var(--acc); }

main { max-width:560px; margin:0 auto; padding:18px 16px 28px; }

/* ---- Szenen-Chips ---- */
.section-title { font-size:11px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--mut); margin:10px 0 12px; font-weight:700; }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { border:1px solid var(--line); background:var(--card); color:var(--txt); border-radius:999px;
  padding:8px 16px; font-size:14px; white-space:nowrap; cursor:pointer; box-shadow:var(--shadow); }
.chip.on { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); font-weight:700; }
[hidden] { display:none !important; }

/* ---- Ziel-Karte ---- */
.card { background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:6px 16px; box-shadow:var(--shadow); }
.row { display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:13px 0; border-bottom:1px solid var(--line); }
.row:last-child { border:none; }
.lbl { font-size:14px; color:var(--txt); }
.val { font-size:14px; font-weight:700; color:var(--fg); min-width:52px; text-align:right;
  font-variant-numeric:tabular-nums; }
input[type=range] { flex:1; accent-color:var(--acc); height:28px; }
input[type=color] { width:44px; height:32px; border:1px solid var(--line); border-radius:8px;
  background:var(--card2); padding:2px; }
select { background:var(--card2); color:var(--fg); border:1px solid var(--line); border-radius:9px;
  padding:8px 10px; font-size:14px; max-width:200px; }
select:focus, input:focus { outline:2px solid var(--ring); outline-offset:1px; }

/* Toggle */
.sw { position:relative; width:50px; height:30px; flex:none; }
.sw input { opacity:0; width:0; height:0; }
.sw i { position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.2s; }
.sw i:before { content:""; position:absolute; width:24px; height:24px; left:3px; top:3px;
  background:#fff; border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
.sw input:checked+i { background:var(--acc); }
.sw input:checked+i:before { transform:translateX(20px); }

/* ---- Buttons ---- */
.btns { display:flex; gap:10px; margin-top:16px; }
button.act { flex:1; padding:14px; font-size:15px; font-weight:700; border-radius:12px; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--fg); box-shadow:var(--shadow); }
button.act:hover { border-color:var(--acc); color:var(--acc); }
button.act.p { background:var(--acc); border-color:var(--acc); color:var(--acc-ink); }
button.act.p:hover { background:var(--acc-hover); border-color:var(--acc-hover); color:var(--acc-ink); }
#msg { text-align:center; font-size:13px; color:var(--mut); margin-top:12px; min-height:18px; }

/* ---- Fusszeile ---- */
.foot { margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
  display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.foot-logo { height:36px; width:auto; display:block; }
.foot-contact { font-size:12px; color:var(--txt); line-height:1.55; }
.foot-contact .strong { font-weight:700; color:var(--fg); }
.foot-contact .muted { color:var(--mut); margin-top:3px; }
.foot-contact a { color:var(--acc); text-decoration:none; }
.foot-contact a:hover { text-decoration:underline; }
</style>
</head>

<script>
let cfg = null, scene = null;
const $ = id => document.getElementById(id);
const api = p => location.pathname.replace(/\/$/,'') + '/api/' + p;

const toHex = v => '#' + (v >>> 0).toString(16).padStart(6,'0').slice(-6);
const fromHex = h => parseInt(h.slice(1), 16);

$('cpYear').textContent = new Date().getFullYear();
$('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('fse-theme', next);
};

async function load(){
  cfg = await (await fetch(api('config'))).json();
  $('title').textContent = cfg.title;
  document.title = 'FACE · ' + cfg.title;
  const names = Object.keys(cfg.scenes);
  // Szenennamen "Szene · Raum" → zwei Reihen (Szene, Raum); sonst eine Reihe mit allen Namen
  split = names.length > 0 && names.every(n => n.includes(SEP));
  if (split) {
    const uniq = a => [...new Set(a)];
    chipRow('chips', uniq(names.map(n => part(n)[0])), g => {
      const room = part(scene)[1];
      select(names.includes(g + SEP + room) ? g + SEP + room : names.find(n => part(n)[0] === g));
    });
    chipRow('chips2', uniq(names.map(n => part(n)[1])), r => {
      const g = part(scene)[0];
      select(names.includes(g + SEP + r) ? g + SEP + r : names.find(n => part(n)[1] === r));
    });
    $('chips2').hidden = $('chips2Title').hidden = false;
  } else {
    chipRow('chips', names, select);
  }
  if (names.length) select(names[0]);
}

const SEP = ' · ';
let split = false;
const part = n => { const i = n.indexOf(SEP); return [n.slice(0, i), n.slice(i + SEP.length)]; };

function chipRow(id, keys, onPick){
  $(id).innerHTML = keys.map(k => `<div class="chip" data-s="${k}">${k}</div>`).join('');
  $(id).querySelectorAll('.chip').forEach(c => c.onclick = () => onPick(c.dataset.s));
}

function select(name){
  scene = name;
  const [g, r] = split ? part(name) : [name, null];
  $('chips').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.s === g));
  $('chips2').querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.s === r));
  render();
}

function render(){
  $('targets').innerHTML = cfg.scenes[scene].map((t,i) => {
    const id = 'c'+i;
    if (t.options && t.varType !== 0) {
      const opts = t.options.map(o =>
        `<option value="${o.value}" ${o.value==t.value?'selected':''}>${o.name}</option>`).join('');
      return `<div class="row"><span class="lbl">${t.label}</span>
        <select id="${id}" data-i="${i}">${opts}</select></div>`;
    }
    if (t.varType === 0) {
      return `<div class="row"><span class="lbl">${t.label}</span>
        <label class="sw"><input type="checkbox" id="${id}" data-i="${i}"
        ${t.value?'checked':''}><i></i></label></div>`;
    }
    if (t.type === 'color') {
      return `<div class="row"><span class="lbl">${t.label}</span>
        <input type="color" id="${id}" data-i="${i}" value="${toHex(t.value)}"></div>`;
    }
    const min = t.min ?? 0, max = (t.max && t.max > t.min) ? t.max : 100;
    const step = t.step || 1, sfx = t.suffix || '';
    return `<div class="row" style="flex-wrap:wrap">
      <span class="lbl" style="width:100%">${t.label}
        <span class="val" style="float:right" id="${id}v">${t.value}${sfx}</span></span>
      <input type="range" id="${id}" data-i="${i}" min="${min}" max="${max}"
        step="${step}" value="${t.value}"
        oninput="document.getElementById('${id}v').textContent=this.value+'${sfx}'"></div>`;
  }).join('');
}

function collect(){
  const values = {};
  cfg.scenes[scene].forEach((t,i) => {
    const el = $('c'+i);
    let v;
    if (t.varType === 0) v = el.checked;
    else if (t.type === 'color') v = fromHex(el.value);
    else v = parseFloat(el.value);
    t.value = v;
    values[t.variableId] = v;
  });
  return values;
}

async function send(path, okText){
  const r = await fetch(api(path), {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scene, values: collect()})});
  const d = await r.json();
  $('msg').textContent = d.ok ? okText : 'Fehler: ' + (d.error || 'unbekannt');
  setTimeout(() => $('msg').textContent = '', 3000);
}

$('test').onclick = () => send('test', 'Szene wird live angezeigt');
$('save').onclick = () => send('save', 'Gespeichert');
load();
</script>
